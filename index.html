<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Companion: Dusk Edition</title>
<style>
:root{
  --bg:#0c0c0f;--panel:#17171c;--panel2:#1d1e23;--panel3:#26272d;
  --text:#f1efe9;--muted:#9a97a3;--primary:#e9dcc4;--primary-dark:#3a3428;
  --secondary:#c8bfff;--secondary-dark:#2c2a3c;--good:#b9cbbd;--good-dark:#132018;
  --rose:#f3b3ae;--rose-dark:#3a1a1c;--danger:#ff9d97;--danger-bg:#2a1414;
  --border:rgba(255,255,255,.08);--shadow:0 20px 60px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;font-family:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
.app{min-height:100vh}
::selection{background:var(--primary);color:#1a1710}

/* ===== Caregiver shell ===== */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:#08080a;border-right:1px solid var(--border);padding:26px 16px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 26px;font-size:21px;font-weight:700;color:var(--primary)}
.brand-icon{width:36px;height:36px;border-radius:10px;background:var(--primary-dark);display:grid;place-items:center;color:var(--primary)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{border:0;background:transparent;color:var(--muted);padding:13px 15px;border-radius:14px;text-align:left;display:flex;align-items:center;gap:12px;font-size:15px}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.active{background:var(--secondary-dark);color:var(--secondary);font-weight:700}
.nav-icon{width:20px;text-align:center}
.patient-toggle{margin-top:auto;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:13px 15px;border-radius:16px;display:flex;align-items:center;gap:9px}
.patient-toggle .state{margin-left:auto;font-size:11px;color:var(--muted)}
.main{margin-left:250px;min-height:100vh}
.topbar{height:72px;position:sticky;top:0;z-index:10;background:rgba(12,12,15,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:42px;height:42px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;font-size:17px}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.user{display:flex;align-items:center;gap:10px;border-left:1px solid var(--border);padding-left:16px;margin-left:6px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#332c1c;display:grid;place-items:center;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.content{padding:32px;max-width:1400px;margin:auto}
h1,h2,h3{margin:0}
h2{font-size:34px}
h3{font-size:19px}
p{line-height:1.55}
.muted{color:var(--muted)}
.header-row{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:24px}
.primary{background:var(--primary);color:#332c1c;border:0;border-radius:28px;padding:0 22px;height:48px;font-weight:700}
.primary:hover{filter:brightness(1.06)}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:28px;padding:0 18px;height:44px}
.secondary:hover{background:var(--panel3)}
.danger{background:var(--danger-bg);color:var(--danger);border:1px solid #603030}
.rosepill{background:var(--rose);color:#4a1216;border:0;border-radius:30px;font-weight:700}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.metric,.panel,.card{background:var(--panel2);border-radius:20px;padding:22px;border:1px solid var(--border)}
.metric-top{display:flex;justify-content:space-between;align-items:flex-start}
.metric-icon{width:44px;height:44px;border-radius:12px;background:var(--panel3);display:grid;place-items:center;color:var(--primary);font-size:19px}
.metric-label{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.metric-number{font-size:34px;font-weight:700;margin-top:10px}
.metric-sub{color:var(--muted);font-size:13px;margin-top:2px}
.ring{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--primary)}

.alert-bar{display:flex;align-items:center;gap:16px;background:var(--danger-bg);border:1px solid #5c2626;border-radius:20px;padding:18px 20px;margin-bottom:20px}
.alert-icon{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#452020;color:var(--danger);display:grid;place-items:center}
.alert-body{flex:1}
.alert-actions{display:flex;gap:10px}
.ok-bar{display:flex;align-items:center;gap:14px;background:var(--good-dark);border:1px solid #2c4436;border-radius:20px;padding:16px 20px;margin-bottom:20px;color:var(--good)}

.grid-main{display:grid;grid-template-columns:1.7fr 1fr;gap:20px}
.qa-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qa-row{display:flex;align-items:center;gap:12px;background:var(--panel3);border:1px solid var(--border);border-radius:16px;padding:14px;text-align:left;color:var(--text)}
.qa-row:hover{background:#2c2d33}
.qa-icon{width:36px;height:36px;border-radius:10px;background:var(--primary-dark);color:var(--primary);display:grid;place-items:center;font-size:16px;flex:0 0 36px}
.insight-card{margin-top:16px;background:linear-gradient(135deg,var(--panel3),var(--panel2));border-radius:18px;padding:18px;border:1px solid var(--border)}
.insight-tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--primary)}

.activity{display:flex;flex-direction:column;gap:15px}
.activity-item{display:flex;gap:12px}
.activity-dot{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--primary-dark);color:var(--primary);display:grid;place-items:center;font-size:15px}

.toolbar{display:flex;gap:10px;margin-bottom:20px}
.toolbar input{flex:1;border-radius:24px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.person-card,.memory-card{background:var(--panel);border-radius:20px;padding:18px;border:1px solid var(--border)}
.person-head{display:flex;gap:12px;align-items:center}
.person-avatar{width:52px;height:52px;border-radius:50%;background:var(--secondary-dark);display:grid;place-items:center;overflow:hidden;flex:0 0 52px}
.person-avatar img{width:100%;height:100%;object-fit:cover}
.card-actions{display:flex;gap:8px;margin-top:14px}
.card-actions button{flex:1}
.memory-image{width:100%;height:160px;background:linear-gradient(135deg,var(--primary-dark),var(--panel3));border-radius:16px;display:grid;place-items:center;color:var(--primary);font-size:46px;overflow:hidden}
.memory-image img{width:100%;height:100%;object-fit:cover}
.routine-row{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:18px;padding:16px;margin-bottom:10px;border:1px solid var(--border)}
.check{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--panel2);color:var(--text);display:grid;place-items:center;flex:0 0 42px}
.check.done{background:var(--good-dark);color:var(--good);border-color:#294133}
.routine-info{flex:1}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;background:var(--panel3);font-size:11px;margin-right:6px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:100}
.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.modal.wide{width:min(960px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
textarea,input,select{width:100%;background:var(--panel3);color:var(--text);border:1px solid transparent;border-radius:14px;padding:13px}
textarea:focus,input:focus,select:focus{border-color:var(--primary);outline:none}
textarea{min-height:150px;resize:vertical}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--panel3);border:1px solid var(--border);padding:13px 18px;border-radius:20px;z-index:200;box-shadow:var(--shadow);color:var(--text)}

/* ===== Routine wizard ===== */
.wiz-tabs{display:flex;gap:6px;background:var(--panel3);border-radius:14px;padding:5px;margin-bottom:18px}
.wiz-tab{flex:1;text-align:center;padding:9px 6px;border-radius:10px;font-size:13px;color:var(--muted);background:transparent;border:0}
.wiz-tab.on{background:var(--panel);color:var(--text);font-weight:700}
.wiz-tab.done{color:var(--primary)}
.wiz-body{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.day-chips{display:flex;gap:6px;margin-top:8px}
.day-chip{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--panel3);color:var(--muted)}
.day-chip.on{background:var(--primary);color:#332c1c;border-color:var(--primary);font-weight:700}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cat-tile{padding:16px;border-radius:14px;background:var(--panel3);border:1px solid var(--border);text-align:left;color:var(--text);display:flex;align-items:center;gap:10px}
.cat-tile.on{border-color:var(--primary);background:var(--primary-dark)}
.preview-panel{background:var(--panel2);border:1px solid var(--border);border-radius:18px;padding:16px}
.preview-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.preview-item:last-child{border-bottom:0}
.preview-time{width:56px;font-size:12px;color:var(--muted);flex:0 0 56px}
.preview-new{background:var(--primary-dark);border-radius:12px;padding:10px;margin:-4px -4px 4px}

/* ===== Patient mode shell ===== */
body.patient-mode{background:var(--bg)}
.pshell{max-width:1100px;margin:0 auto;padding:26px}
.pnav{display:flex;align-items:center;gap:26px;background:var(--panel2);border:1px solid var(--border);border-radius:24px;padding:14px 22px;margin-bottom:22px}
.pnav .brand2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:9px;color:var(--text)}
.pnav .brand2 .brand-icon{width:32px;height:32px;font-size:15px}
.plinks{display:flex;gap:6px;margin-left:6px}
.plinks button{background:transparent;border:0;color:var(--muted);padding:9px 14px;border-radius:12px;font-weight:600}
.plinks button.active{background:var(--panel3);color:var(--text)}
.pnav .spacer{flex:1}
.sos{padding:0 20px;height:42px}
.pexit{background:transparent;border:1px solid var(--border);color:var(--muted);width:38px;height:38px;border-radius:50%}
.pcard{background:var(--panel2);border:1px solid var(--border);border-radius:26px;padding:30px}
.voice-mic{width:120px;height:120px;border-radius:50%;background:var(--panel3);border:1px solid var(--border);display:grid;place-items:center;margin:26px auto;font-size:42px;color:var(--primary)}
.voice-mic.listening{background:var(--primary-dark);box-shadow:0 0 0 10px rgba(233,220,196,.08)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.chip{background:var(--panel3);border:1px solid var(--border);border-radius:18px;padding:20px;text-align:left;color:var(--text);display:flex;align-items:center;gap:12px}
.chip .ic{font-size:20px;color:var(--primary)}
.confirm-banner{background:var(--good-dark);border:1px solid #2c4436;color:var(--good);border-radius:16px;padding:14px 18px;margin-top:18px;text-align:center;font-weight:600}
.filters{display:flex;gap:8px;margin:18px 0}
.filters button{background:var(--panel3);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:8px 16px}
.filters button.active{background:var(--primary);color:#332c1c;border-color:var(--primary);font-weight:700}
.people-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.pperson{background:var(--panel);border:1px solid var(--border);border-radius:22px;overflow:hidden;text-align:left;color:var(--text)}
.pperson-photo{height:150px;background:linear-gradient(135deg,var(--primary-dark),var(--panel3));display:grid;place-items:center;color:var(--primary);font-size:44px;overflow:hidden}
.pperson-photo img{width:100%;height:100%;object-fit:cover}
.pperson-body{padding:16px}
.tag{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ptimeline{position:relative;padding-left:70px}
.ptl-row{position:relative;margin-bottom:18px}
.ptl-time{position:absolute;left:-70px;top:14px;width:56px;font-size:13px;color:var(--muted);text-align:right}
.ptl-dot{position:absolute;left:-26px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--border)}
.ptl-dot.now{background:var(--primary);box-shadow:0 0 0 4px rgba(233,220,196,.25)}
.ptl-dot.done{background:var(--good)}
.ptl-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px 18px}
.ptl-card.now{border-color:var(--primary)}
.daily-note{background:var(--panel3);border-radius:20px;padding:18px;margin-bottom:18px}
.progress-track{background:var(--panel3);border-radius:20px;height:10px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--primary)}
.pprofile-head{display:flex;gap:20px}
.pprofile-photo{width:150px;height:180px;border-radius:20px;background:linear-gradient(135deg,var(--primary-dark),var(--panel3));overflow:hidden;flex:0 0 150px;display:grid;place-items:center;color:var(--primary);font-size:44px}
.pprofile-photo img{width:100%;height:100%;object-fit:cover}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.mem-entry{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}
.who-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.match-card{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:20px}
.match-found{display:inline-block;font-size:11px;background:var(--good-dark);color:var(--good);padding:5px 12px;border-radius:20px;margin-bottom:10px}

/* ===== Face scan (shared) ===== */
.face-scan-panel{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:22px}
.face-video-wrap{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center}
.face-video-wrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.face-overlay{position:absolute;inset:0;pointer-events:none}
.face-status{padding:13px 15px;border-radius:14px;background:var(--panel2);margin-top:12px;color:var(--muted)}
.face-result{margin-top:12px}
.face-result-inner{padding:16px;border-radius:16px;background:var(--panel2)}
.face-result-inner.match{border:1px solid #4a6a52;background:#0f1c14}
.face-result-inner.nomatch{border:1px solid #603030;background:#241313}
.face-person{display:flex;align-items:center;gap:12px}
.face-person img{width:58px;height:58px;border-radius:50%;object-fit:cover}
.face-person .avatar{width:58px;height:58px}

.patient-mode .content{max-width:1200px}
@media(max-width:1050px){.sidebar{width:210px}.main{margin-left:210px}.grid-main{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.wiz-body{grid-template-columns:1fr}.who-grid{grid-template-columns:1fr}.people-grid{grid-template-columns:1fr}.chips{grid-template-columns:1fr}}
@media(max-width:800px){.sidebar{position:static;width:auto;height:auto}.main{margin-left:0}.metrics,.cards,.qa-list{grid-template-columns:1fr}.topbar{position:static}.user div:first-child{display:none}.content{padding:18px}h2{font-size:28px}.header-row{align-items:start;flex-direction:column}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.pshell{padding:14px}.pnav{flex-wrap:wrap;gap:10px}}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";

const STORAGE="memory_companion_dusk_v1";
const CATS={
  Medication:"pill",Meals:"meal",Exercise:"walk",Social:"social",Appointment:"calendar",PersonalCare:"care"
};
const CAT_ICON={pill:"💊",meal:"🍽",walk:"🚶",social:"🧩",calendar:"📅",care:"🧴"};

const defaultData=()=>({
  profile:{name:"Sarah Miller",role:"Primary Caregiver",email:"sarah@example.com"},
  patient:{name:"Robert",dailyNote:"A gentle morning. Remember to take it one step at a time, Robert."},
  people:[
    {id:id(),name:"Priya",relation:"Daughter",category:"Family",age:"41",phone:"+1 555 0142",livesIn:"Seattle, Washington",birthday:"October 14",pets:"Golden Retriever named Charlie",notes:"She loves gardening and making tea with you.",photo:""},
    {id:id(),name:"Michael",relation:"Grandson",category:"Family",age:"22",phone:"",livesIn:"",birthday:"",pets:"",notes:"He is currently studying music composition at the conservatory.",photo:""},
    {id:id(),name:"David",relation:"Old Friend",category:"Friends",age:"79",phone:"",livesIn:"",birthday:"",pets:"",notes:"We served in the Navy together. He tells great stories.",photo:""},
    {id:id(),name:"Elena",relation:"Caregiver",category:"Caregivers",age:"",phone:"",livesIn:"",birthday:"",pets:"",notes:"Helps with medications and physical therapy in the mornings.",photo:""}
  ],
  memories:[
    {id:id(),title:"Walking Charlie at Discovery Park",person:"Priya",date:"2026-08-16",created:new Date().toISOString(),description:"We had a wonderful afternoon walking Charlie near the water. The weather was perfect, and we stopped for ice cream afterwards. You mentioned how much you loved the sea breeze.",image:""},
    {id:id(),title:"Thanksgiving Dinner 2023",person:"Priya",date:"2023-11-23",created:new Date().toISOString(),description:"Priya hosted Thanksgiving this year. She made your favorite sweet potato casserole. The whole family was there, and we stayed up late playing board games by the fire.",image:""},
    {id:id(),title:"Priya's College Graduation",person:"Priya",date:"2015-05-10",created:new Date().toISOString(),description:"A proud family memory.",image:""}
  ],
  routines:[
    {id:id(),title:"Breakfast: Oatmeal & Fruit",person:"",time:"08:00",category:"Meals",days:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],done:true,notes:""},
    {id:id(),title:"Morning Pills",person:"",time:"09:30",category:"Medication",days:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],done:false,notes:"Take after breakfast."},
    {id:id(),title:"Doctor's Appointment",person:"David",time:"10:30",category:"Appointment",days:["Tue"],done:false,notes:"Dr. Reynolds at the City Medical Center. David will pick you up."},
    {id:id(),title:"Lunch with Priya",person:"Priya",time:"13:00",category:"Meals",days:["Tue"],done:false,notes:"Sandwiches at the park cafe."},
    {id:id(),title:"Puzzle Time",person:"",time:"15:00",category:"Social",days:["Mon","Tue","Wed","Thu","Fri"],done:false,notes:"Landscape jigsaw."}
  ],
  notes:[{id:id(),person:"David",text:"Seemed a bit confused during lunch. Will monitor tomorrow.",created:new Date().toISOString()}],
  trash:[],
  activities:[
    {id:id(),type:"person",text:"Priya was successfully identified via facial scan.",detail:"Living Room Camera",when:new Date().toLocaleString()},
    {id:id(),type:"memory",text:"New memory added: Summer trip to Maine (1998).",detail:"Added by Sarah",when:new Date().toLocaleString()},
    {id:id(),type:"routine",text:"Afternoon Walk routine completed.",detail:"Marked by Robert",when:new Date().toLocaleString()}
  ],
  settings:{patientMode:false}
});
let db=load();
let page="dashboard", pPage="home", pPersonId=null, dPersonId=null;
let query="", filter="all", pFilter="all", modal=null;
if(!Array.isArray(db.trash)){db.trash=[];save()}

function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(STORAGE));
    if(x&&x.people&&x.memories&&x.routines){
      if(!Array.isArray(x.notes))x.notes=[];
      if(!Array.isArray(x.trash))x.trash=[];
      if(!Array.isArray(x.activities))x.activities=[];
      if(!x.settings)x.settings={patientMode:false};
      if(!x.profile)x.profile={name:"Sarah Miller",role:"Primary Caregiver",email:""};
      if(!x.patient)x.patient={name:"Robert",dailyNote:"A gentle morning. Take it one step at a time."};
      return x;
    }
    return defaultData();
  }catch(e){return defaultData()}
}
function save(){localStorage.setItem(STORAGE,JSON.stringify(db))}
function esc(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]))}
function setPage(p){page=p;query="";render()}
function notify(msg){const e=document.createElement("div");e.className="toast";e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function act(type,text,detail=""){db.activities.unshift({id:id(),type,text,detail,when:new Date().toLocaleString()});db.activities=db.activities.slice(0,100);save()}
function icon(n){const m={dashboard:"▦",group:"◉",auto_stories:"▤",event_repeat:"↻",sticky_note_2:"▱",timeline:"◷",settings:"⚙",accessibility_new:"♿",add:"＋",person_add:"＋",photo_library:"▧",event_available:"✓",edit_note:"✎",notifications:"●",search:"⌕",person:"●",delete:"×",edit:"✎",close:"×",check:"✓",radio_button_unchecked:"○",add_photo_alternate:"▧",add_task:"✓",download:"↓",upload:"↑",mic:"🎙",stop:"■",play_arrow:"▶",lock:"🔒",phone:"📞",back:"←",exit:"⏻"};return m[n]||"•"}
function matches(o,keys){if(!query)return true;const q=query.toLowerCase();return keys.some(k=>String(o[k]||"").toLowerCase().includes(q))}
function title(){return ({dashboard:"Caregiver Dashboard",people:"People",memories:"Memories",routines:"Routines",notes:"Notes",activity:"Activity",scanner:"Face Scanner",trash:"Trash",settings:"Settings",profile:"Profile"})[page]}
function nav(p,ic,label){return `<button class="${page===p?"active":""}" data-nav="${p}"><span class="nav-icon">${icon(ic)}</span>${label}</button>`}

<header class="topbar"><h1>${title()}</h1><div class="top-actions">

</div></header>

function dashboardAlertRoutine(){
  return db.routines.find(r=>r.category==="Medication" && !r.done) || null;
}

function dashboard(){
const alertR=dashboardAlertRoutine();
const doneCount=db.routines.filter(x=>x.done).length;
const totalCount=db.routines.length||1;
const pct=Math.round(doneCount/totalCount*100);
const recentMemories=db.memories.filter(m=>{const c=new Date(m.created||m.date||Date.now()).getTime();return Date.now()-c<7*86400000}).length;
return `<div class="header-row"><div><h2>Overview</h2><p class="muted" style="font-size:16px">Good morning, ${esc((db.profile.name||"Caregiver").split(" ")[0])}. Here's a snapshot of ${esc(db.patient.name)}'s care today.</p></div><button class="primary" data-add="quick">${icon("add")} Quick Entry</button></div>
<div class="metrics">
${metric("group","Tracked",db.people.length,"People")}
${metric("auto_stories","Shared",db.memories.length,"Memories")}
${metric("event_repeat","Today's Tasks",totalCount,"Total")}
${metricRing("Progress",pct,`${doneCount} Done`)}
</div>
${alertR?`<div class="alert-bar"><div class="alert-icon">${icon("notifications")}</div><div class="alert-body"><b>Alert: ${esc(alertR.title)} missed</b><div class="muted" style="margin-top:2px">Not marked done for ${esc(db.patient.name)}${alertR.time?` (Scheduled for ${fmtTime(alertR.time)})`:""}</div></div><div class="alert-actions"><button class="secondary" data-toggle="${alertR.id}">${icon("check")} Mark Done</button><button class="rosepill" style="height:44px" data-call="${esc(alertR.person||db.patient.name)}">${icon("phone")} Call Patient</button></div></div>`
:`<div class="ok-bar">${icon("check")} All of today's medications are marked done.</div>`}
<div class="grid-main">
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h3>Recent Activity</h3><button class="secondary" data-nav="activity">View All</button></div>${activityHTML(db.activities.slice(0,6))}</section>
<section>
<div class="panel"><h3>Quick Actions</h3><div class="qa-list">
<button class="qa-row" data-add="person"><span class="qa-icon">${icon("person_add")}</span>Add Person</button>
<button class="qa-row" data-wizard="routine"><span class="qa-icon">${icon("event_available")}</span>Create Routine</button>
<button class="qa-row" data-add="memory" style="grid-column:1/-1"><span class="qa-icon">${icon("photo_library")}</span>Log Memory</button>
</div></div>
<div class="insight-card"><div class="insight-tag">Daily Insight</div><p style="margin-top:8px;margin-bottom:0">${esc(db.patient.name)}'s engagement with memories: <b>${recentMemories} added this week</b>. ${db.memories.length?"Keep sharing familiar moments together.":"Add a memory to get started."}</p></div>
</section>
</div>`;
}
function fmtTime(t){if(!t)return"";const[h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";const hh=((h+11)%12)+1;return `${hh}:${String(m).padStart(2,"0")} ${ap}`}
function metric(ic,label,n,unit){return `<div class="metric"><div class="metric-top"><div class="metric-icon">${icon(ic)}</div></div><div class="metric-number">${n}</div><div class="metric-sub">${label} · ${unit}</div></div>`}
function metricRing(label,pct,sub){return `<div class="metric"><div class="metric-top"><div class="ring" style="background:conic-gradient(var(--primary) ${pct*3.6}deg,var(--panel3) 0)"><div style="width:34px;height:34px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:11px">${pct}%</div></div></div><div class="metric-number" style="font-size:20px;margin-top:14px">${label}</div><div class="metric-sub">${sub}</div></div>`}
function activityHTML(list){
if(!list.length)return `<div class="empty">No activity yet.</div>`;
return `<div class="activity">${list.map(a=>`<div class="activity-item"><div class="activity-dot">${icon(a.type==="memory"?"auto_stories":a.type==="routine"?"check":a.type==="person"?"group":"edit_note")}</div><div><b>${esc(a.text)}</b><div class="muted">${esc(a.detail||"")}</div><small class="muted">${esc(a.when)}</small></div></div>`).join("")}</div>`;
}

function people(){
const data=db.people.filter(p=>matches(p,["name","relation","phone","notes"]));
return `<div class="header-row"><div><h2>People</h2><p class="muted">${db.people.length} connected profiles</p></div><button class="primary" data-add="person">${icon("person_add")} Add Person</button></div>${toolbar("Search people...")}<div class="cards">${data.map(p=>`<article class="person-card"><div class="person-head"><div class="person-avatar">${p.photo?`<img src="${p.photo}">`:icon("person")}</div><div style="flex:1"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.relation)}${p.age?" · "+esc(p.age):""}</div></div><button class="icon-btn" data-edit="person" data-id="${p.id}">${icon("edit")}</button></div><p class="muted" style="min-height:42px">${esc(p.notes||"No notes.")}</p><div class="card-actions"><button class="secondary" data-view="${p.id}">View</button><button class="secondary danger" data-delete="person" data-id="${p.id}" type="button">Delete</button></div></article>`).join("")||empty("No people match your search.")}</div>`;
}
function memories(){
const data=db.memories.filter(m=>matches(m,["title","person","description"]));
return `<div class="header-row"><div><h2>Memories</h2><p class="muted">${db.memories.length} stories</p></div><button class="primary" data-add="memory">${icon("add_photo_alternate")} Add Memory</button></div>${toolbar("Search memories...")}<div class="cards">${data.map(m=>`<article class="memory-card"><div class="memory-image">${m.image?`<img src="${m.image}">`:icon("auto_stories")}</div><div style="padding-top:14px"><div style="display:flex;gap:10px;justify-content:space-between"><div><h3>${esc(m.title)}</h3><div class="muted">${esc(m.person||"Unassigned")} · ${esc(m.date||"")}</div></div><button class="icon-btn" data-edit="memory" data-id="${m.id}">${icon("edit")}</button></div><p class="muted">${esc(m.description||"")}</p><button class="secondary danger" style="width:100%" data-delete="memory" data-id="${m.id}" type="button">Delete</button></div></article>`).join("")||empty("No memories match your search.")}</div>`;
}
function routines(){
const data=db.routines.filter(r=>matches(r,["title","person","time","notes"]));
return `<div class="header-row"><div><h2>Routines</h2><p class="muted">${db.routines.length} routines · ${db.routines.filter(x=>x.done).length} completed</p></div><button class="primary" data-wizard="routine">${icon("add_task")} Add Routine</button></div>${toolbar("Search routines...")}${data.map(r=>`<div class="routine-row"><button class="check ${r.done?"done":""}" data-toggle="${r.id}">${icon(r.done?"check":"radio_button_unchecked")}</button><div class="routine-info"><h3 class="${r.done?"muted":""}" style="${r.done?"text-decoration:line-through":""}">${esc(r.title)}</h3><div class="muted">${esc(r.person||"No person")} · ${esc(fmtTime(r.time)||"No time")}${r.category?" · "+esc(r.category):""}</div><div style="margin-top:6px">${(r.days||[]).map(d=>`<span class="badge">${esc(d)}</span>`).join("")}</div><div class="muted">${esc(r.notes||"")}</div></div><button class="secondary" data-wizard="routine" data-id="${r.id}">Edit</button><button class="secondary danger" data-delete="routine" data-id="${r.id}" type="button">Delete</button></div>`).join("")||empty("No routines match your search.")}`;
}
function notes(){
const data=db.notes.filter(n=>matches(n,["person","text"]));
return `<div class="header-row"><div><h2>Care Notes</h2><p class="muted">${db.notes.length} caregiver notes</p></div><button class="primary" data-add="note">${icon("edit_note")} Add Note</button></div>${toolbar("Search notes...")}${data.map(n=>`<article class="panel" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(n.person||"General")}</b><div class="muted">${new Date(n.created).toLocaleString()}</div></div><div><button class="icon-btn" data-edit="note" data-id="${n.id}">${icon("edit")}</button><button class="icon-btn" data-delete="note" data-id="${n.id}" type="button">${icon("delete")}</button></div></div><p style="font-size:17px">${esc(n.text)}</p></article>`).join("")||empty("No notes match your search.")}`;
}
function activity(){
let list=db.activities;
if(filter!=="all")list=list.filter(a=>a.type===filter);
if(query){const q=query.toLowerCase();list=list.filter(a=>(a.text+" "+a.detail).toLowerCase().includes(q))}
return `<div class="header-row"><div><h2>Activity</h2><p class="muted">A record of actions in this workspace.</p></div><button class="secondary danger" id="clearActivity">Clear Activity</button></div>${toolbar("Search activity...")}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">${["all","person","memory","routine","note"].map(f=>`<button class="${filter===f?"primary":"secondary"}" style="height:40px" data-filter="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join("")}</div><div class="panel">${activityHTML(list)}</div>`;
}

return `<div class="header-row"><div><h2>Face Scanner</h2><p class="muted">Live face recognition against people enrolled in this Memory Companion workspace.</p></div></div>${localWarning}

  <button class="secondary" style="margin-top:18px" data-nav="people">Manage People</button>
</section>

function trash(){
  const groups={person:[],memory:[],routine:[],note:[]};
  db.trash.forEach(x=>{if(groups[x.type])groups[x.type].push(x)});
  const total=db.trash.length;
  return `<div class="header-row">
    <div><h2>Trash</h2><p class="muted">${total} deleted item${total===1?"":"s"} · Items stay here until permanently deleted or restored.</p></div>
    <div style="display:flex;gap:8px">
      <button class="secondary" id="restoreAll" ${total?"":"disabled"}>Restore All</button>
      <button class="secondary danger" id="emptyTrash" ${total?"":"disabled"}>Empty Trash</button>
    </div>
  </div>
  ${total?["person","memory","routine","note"].map(t=>groups[t].length?`
  <div class="panel" style="margin-bottom:18px">
    <h3 style="margin-bottom:14px">${t[0].toUpperCase()+t.slice(1)}s</h3>
    ${groups[t].map(x=>`
      <div class="routine-row" style="margin-bottom:8px">
        <div class="activity-dot">${icon(t==="person"?"group":t==="memory"?"auto_stories":t==="routine"?"event_repeat":"sticky_note_2")}</div>
        <div class="routine-info">
          <h3>${esc(trashLabel(x))}</h3>
          <div class="muted">Deleted ${esc(x.deletedAt || "")}</div>
        </div>
        <button class="secondary" data-restore="${x.trashId}">Restore</button>
        <button class="secondary danger" data-permanent="${x.trashId}">Delete Permanently</button>
      </div>`).join("")}
  </div>`:"").join(""):`<div class="panel empty">${icon("delete")}<div style="margin-top:10px">Trash is empty.</div></div>`}`;
}
function trashLabel(x){const o=x.item||{};return o.name||o.title||o.text||"Deleted item"}
function settings(){

<div class="panel" style="margin-bottom:18px"><h3>Caregiver Profile</h3><div class="form-grid" style="margin-top:16px"><input id="profileName" placeholder="Name" value="${esc(db.profile.name)}"><input id="profileRole" placeholder="Role" value="${esc(db.profile.role)}"><input class="full" id="profileEmail" placeholder="Email" value="${esc(db.profile.email)}"></div><div class="form-actions"><button class="primary" id="saveProfile">Save Profile</button></div></div>

<div class="panel"><h3>Patient Mode</h3><p class="muted">A larger-touch simplified presentation for the person receiving care.</p><button class="secondary" id="patientBtn">${db.settings.patientMode?"Disable":"Enable"} Patient Mode</button></div>`;

function pRoutine(){
  const list=[...db.routines].sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const nowT=new Date();const nowHM=String(nowT.getHours()).padStart(2,"0")+":"+String(nowT.getMinutes()).padStart(2,"0");
  const done=list.filter(x=>x.done).length;
  const nextUp=list.find(r=>!r.done && r.time>=nowHM) || list.find(r=>!r.done);
  return `<h2>Today's Routine</h2><p class="muted">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</p>
  <div class="daily-note"><span class="tag">Daily Note</span><p style="margin:6px 0 0">"${esc(db.patient.dailyNote)}"</p></div>
  <div class="panel" style="margin-bottom:22px"><div style="display:flex;justify-content:space-between"><b>Daily Progress</b><span class="muted">${done} of ${list.length} tasks</span></div><div class="progress-track"><div class="progress-fill" style="width:${list.length?Math.round(done/list.length*100):0}%"></div></div></div>
  <div class="ptimeline">${list.map(r=>{
    const isNow=nextUp&&r.id===nextUp.id;
    return `<div class="ptl-row"><div class="ptl-time">${fmtTime(r.time)}</div><div class="ptl-dot ${r.done?"done":isNow?"now":""}"></div>
    <div class="ptl-card ${isNow?"now":""}">
      ${isNow?`<span class="tag" style="color:var(--primary)">Happening Now</span>`:""}
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div><span class="tag">${esc(r.category||"")}</span><h3 style="margin-top:2px">${esc(r.title)}</h3></div>
        <button class="check ${r.done?"done":""}" data-toggle="${r.id}">${icon(r.done?"check":"radio_button_unchecked")}</button>
      </div>
      ${r.notes?`<p class="muted" style="margin-top:6px">${esc(r.notes)}</p>`:""}
      ${isNow&&r.person?`<div class="form-actions" style="justify-content:flex-start;margin-top:10px"><button class="secondary" data-call="${esc(r.person)}">${icon("phone")} Call ${esc(r.person)}</button></div>`:""}
    </div></div>`;
  }).join("")||empty("No routines scheduled.")}</div>`;
}

function pScanner(){

/* ================= Routine Wizard ================= */
let wStep=1,wData=null;
const CATEGORIES=[["Medication","💊"],["Meals","🍽"],["Exercise","🚶"],["Social","🧩"],["Appointment","📅"],["PersonalCare","🧴"]];
function openRoutineWizard(item){
  wStep=1;
  wData=item?{id:item.id,title:item.title,person:item.person||"",time:item.time||"08:00",days:[...(item.days||[])],category:item.category||"Medication",notes:item.notes||"",done:item.done||false}
        :{id:id(),title:"",person:"",time:"08:00",days:[],category:"Medication",notes:"",done:false};
  const el=document.createElement("div");el.className="modal-wrap";el.id="modal";
  el.innerHTML=`<div class="modal wide" id="wizModal"></div>`;
  document.body.appendChild(el);
  document.addEventListener("click",wizOutsideClose);
  renderWizard();
}
function wizOutsideClose(e){}
function wizStepLabel(n){return {1:"Time",2:"Category",3:"Details",4:"Assign"}[n]}
function renderWizard(){
  const m=document.getElementById("wizModal");if(!m)return;
  const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let body="";
  if(wStep===1){
    body=`<h3 style="margin-bottom:10px">Time &amp; Frequency</h3>
    <input id="wTime" type="time" value="${esc(wData.time)}" style="max-width:220px">
    <div class="day-chips">${days.map(d=>`<button class="day-chip ${wData.days.includes(d)?"on":""}" data-day="${d}">${d[0]}</button>`).join("")}</div>
    <p class="muted" style="margin-top:10px">Choose the days this routine repeats.</p>`;
  }else if(wStep===2){
    body=`<h3 style="margin-bottom:10px">Category</h3><div class="cat-grid">${CATEGORIES.map(([c,ic])=>`<button class="cat-tile ${wData.category===c?"on":""}" data-cat="${c}"><span style="font-size:20px">${ic}</span>${c.replace(/([A-Z])/g," $1").trim()}</button>`).join("")}</div>`;
  }else if(wStep===3){
    body=`<h3 style="margin-bottom:10px">Details</h3><input id="wTitle" placeholder="Routine title (e.g. Evening Medication)" value="${esc(wData.title)}" class="full" style="margin-bottom:10px"><textarea id="wNotes" placeholder="Notes for this routine...">${esc(wData.notes)}</textarea>`;
  }else{
    body=`<h3 style="margin-bottom:10px">Assign</h3><select id="wPerson" class="full"><option value="">${esc(db.patient.name)} (Self)</option>${db.people.map(p=>`<option ${wData.person===p.name?"selected":""}>${esc(p.name)}</option>`).join("")}</select><p class="muted" style="margin-top:10px">Choose who this routine involves, if anyone besides ${esc(db.patient.name)}.</p>`;
  }
  m.innerHTML=`<div class="modal-head"><h3>Add New Routine</h3><button class="icon-btn" id="closeModal">${icon("close")}</button></div>
  <div class="wiz-tabs">${[1,2,3,4].map(n=>`<button class="wiz-tab ${wStep===n?"on":""} ${wStep>n?"done":""}" data-step="${n}">${n}. ${wizStepLabel(n)}</button>`).join("")}</div>
  <div class="wiz-body"><div>${body}</div>${wizPreview()}</div>
  <div class="form-actions">
    <button class="secondary" id="cancel">Cancel</button>
    ${wStep>1?`<button class="secondary" id="wizBack">Back</button>`:""}
    ${wStep<4?`<button class="primary" id="wizNext">Next →</button>`:`<button class="primary" id="wizSave">Save Routine</button>`}
  </div>`;
  document.getElementById("closeModal").onclick=closeModal;
  document.getElementById("cancel").onclick=closeModal;
  m.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{const n=+b.dataset.step;if(n<=wStep||wizValidate(wStep)){wStep=n;wizPull();renderWizard()}});
  m.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{const d=b.dataset.day;wData.days=wData.days.includes(d)?wData.days.filter(x=>x!==d):[...wData.days,d];renderWizard()});
  m.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{wData.category=b.dataset.cat;renderWizard()});
  document.getElementById("wizBack")?.addEventListener("click",()=>{wizPull();wStep--;renderWizard()});
  document.getElementById("wizNext")?.addEventListener("click",()=>{if(!wizValidate(wStep))return;wizPull();wStep++;renderWizard()});
  document.getElementById("wizSave")?.addEventListener("click",()=>{wizPull();saveRoutineWizard()});
}
function wizPull(){
  if(wStep===1){const t=document.getElementById("wTime");if(t)wData.time=t.value||wData.time}
  if(wStep===3){const t=document.getElementById("wTitle"),n=document.getElementById("wNotes");if(t)wData.title=t.value.trim();if(n)wData.notes=n.value.trim()}
  if(wStep===4){const p=document.getElementById("wPerson");if(p)wData.person=p.value}
}
function wizValidate(step){
  if(step===3){const t=document.getElementById("wTitle");if(t&&!t.value.trim()){notify("Give this routine a title");return false}}
  return true;
}
function wizPreview(){
  const upcoming=[...db.routines].sort((a,b)=>(a.time||"").localeCompare(b.time||"")).slice(0,4);
  return `<div class="preview-panel">
    <div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">${icon("timeline")} Live Preview</div>
    <div class="preview-item preview-new"><div class="preview-time">${fmtTime(wData.time)}</div><div><b>${esc(wData.title||"New routine")}</b><div class="muted" style="font-size:12px">${wData.category.replace(/([A-Z])/g," $1").trim()}${wData.person?" · "+esc(wData.person):""}</div></div></div>
    ${upcoming.map(r=>`<div class="preview-item"><div class="preview-time">${fmtTime(r.time)}</div><div><b>${esc(r.title)}</b><div class="muted" style="font-size:12px">${esc(r.person||db.patient.name)}</div></div></div>`).join("")}
  </div>`;
}
function saveRoutineWizard(){
  if(!wData.title){notify("Give this routine a title");wStep=3;renderWizard();return}
  const arr=db.routines;const idx=arr.findIndex(x=>x.id===wData.id);
  const record={id:wData.id,title:wData.title,person:wData.person,time:wData.time,days:wData.days,category:wData.category,notes:wData.notes,done:wData.done};
  if(idx>=0)arr[idx]=record;else arr.unshift(record);
  act("routine",`Routine ${idx>=0?"updated":"added"}: ${record.title}`,record.person||db.patient.name);
  save();closeModal();render();notify("Routine saved");
}

  }else if(kind==="call"){
    callPerson("Priya");
    if(box)box.innerHTML=`<div class="confirm-banner">${icon("phone")} Calling Priya...</div>`;
  }
}

function bind(){
  if(!window.__memoryCompanionClickBound){
    window.__memoryCompanionClickBound=true;
    document.addEventListener("click", function(e){
      const b=e.target.closest("button");
      if(!b)return;

      const nav=b.dataset.nav;
      if(nav){setPage(nav);return}

      const pnav=b.dataset.pnav;
      if(pnav){pPage=pnav;query="";render();return}

      const pfilter=b.dataset.pfilter;
      if(pfilter){pFilter=pfilter;render();return}

      const pview=b.dataset.pview;
      if(pview){pPersonId=pview;pPage="profile";render();return}

      const view=b.dataset.view;
      if(view){dPersonId=view;page="profile";render();return}

      const call=b.dataset.call;
      if(call){callPerson(call);return}

      const voice=b.dataset.voice;
      if(voice){voiceAction(voice);return}

      const add=b.dataset.add;
      if(add){add==="quick"?quickAdd():openForm(add,null,{forperson:b.dataset.forperson});return}

      const wiz=b.dataset.wizard;
      if(wiz==="routine"){
        const item=b.dataset.id?db.routines.find(x=>x.id===b.dataset.id):null;
        openRoutineWizard(item);
        return;
      }

      const editType=b.dataset.edit;
      if(editType){
        const collection={person:"people",memory:"memories",routine:"routines",note:"notes"}[editType];
        const item=collection?db[collection].find(x=>x.id===b.dataset.id):null;
        if(item)openForm(editType,item);
        return;
      }

      const deleteType=b.dataset.delete;
      if(deleteType){remove(deleteType,b.dataset.id);return}

      const toggleId=b.dataset.toggle;
      if(toggleId){
        const r=db.routines.find(x=>x.id===toggleId);
        if(r){r.done=!r.done;act("routine",`${r.title} ${r.done?"completed":"reopened"}`,r.person||"");save();render();}
        return;
      }

      const restoreId=b.dataset.restore;
      if(restoreId){restoreTrash(restoreId);return}

      const permanentId=b.dataset.permanent;
      if(permanentId){permanentDelete(permanentId);return}

      const filterType=b.dataset.filter;
      if(filterType){filter=filterType;render();return}
    });
  }

  const s=document.getElementById("searchInput");
  if(s && !s.dataset.bound){
    s.dataset.bound="1";
    s.oninput=()=>{query=s.value;clearTimeout(window.searchTimer);window.searchTimer=setTimeout(render,180)};
  }

function remove(type,idv){
  const arr=db[type+"s"];
  const item=arr.find(x=>x.id===idv);
  if(!item)return;
  if(!confirm(`Move this ${type} to Trash? You can restore it later.`))return;
  db[type+"s"]=arr.filter(x=>x.id!==idv);
  db.trash.unshift({trashId:id(),type,item:JSON.parse(JSON.stringify(item)),deletedAt:new Date().toLocaleString()});
  act(type,`${type[0].toUpperCase()+type.slice(1)} moved to Trash`,trashLabel({item}));
  save();render();notify("Moved to Trash");
}
function restoreTrash(trashId){
  const i=db.trash.findIndex(x=>x.trashId===trashId);
  if(i<0)return;
  const x=db.trash[i];
  const key=x.type+"s";
  if(!db[key])return;
  const restored={...x.item};
  if(db[key].some(y=>y.id===restored.id))restored.id=id();
  db[key].unshift(restored);
  db.trash.splice(i,1);
  act(x.type,`${x.type[0].toUpperCase()+x.type.slice(1)} restored`,trashLabel(x));
  save();render();notify("Restored");
}
function permanentDelete(trashId){
  const i=db.trash.findIndex(x=>x.trashId===trashId);
  if(i<0)return;
  const x=db.trash[i];
  if(!confirm(`Permanently delete ${trashLabel(x)}? This cannot be undone.`))return;
  db.trash.splice(i,1);
  act(x.type,`${x.type[0].toUpperCase()+x.type.slice(1)} permanently deleted`,trashLabel(x));
  save();render();notify("Permanently deleted");
}
function restoreAllTrash(){
  if(!db.trash.length)return;
  if(!confirm("Restore every item from Trash?"))return;
  const items=[...db.trash];db.trash=[];
  for(const x of items){
    const key=x.type+"s", restored={...x.item};
    if(!db[key])continue;
    if(db[key].some(y=>y.id===restored.id))restored.id=id();
    db[key].unshift(restored);
  }
  act("trash","All deleted items restored");
  save();render();notify("All items restored");
}
function emptyTrash(){
  if(!db.trash.length)return;
  if(!confirm("Permanently delete everything in Trash? This cannot be undone."))return;
  const n=db.trash.length;db.trash=[];
  act("trash","Trash emptied",`${n} items permanently deleted`);
  save();render();notify("Trash emptied");
}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="memory-companion-backup.json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function importData(e){try{const file=e.target.files[0];if(!file)return;const x=JSON.parse(await file.text());if(!x.people||!x.memories||!x.routines||!x.notes)throw Error("bad");db=x;save();render();notify("Backup imported")}catch(err){notify("Invalid backup file")}e.target.value=""}

/* ================= Face scanner engine ================= */
let faceStream=null,faceModelsReady=false,faceMatcher=null,faceAutoTimer=null,faceScanning=false,faceLastUnknownSignature="",faceLastMatch="",faceLastResultAt=0;

async function loadFaceModels(){
  if(faceModelsReady)return;
  const base="https://justadudewhohacks.github.io/face-api.js/models";
  const status=document.getElementById("faceStatus");
  if(status)status.textContent="Loading recognition model…";
  await faceapi.nets.tinyFaceDetector.loadFromUri(base);
  await faceapi.nets.faceLandmark68Net.loadFromUri(base);
  await faceapi.nets.faceRecognitionNet.loadFromUri(base);
  faceModelsReady=true;
}
async function buildFaceMatcher(){
  await loadFaceModels();
  const labeled=[];
  for(const p of db.people){
    if(!p.photo)continue;
    try{
      const img=await faceapi.fetchImage(p.photo);
      const d=await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.45})).withFaceLandmarks().withFaceDescriptor();
      if(d) labeled.push(new faceapi.LabeledFaceDescriptors(p.id,[d.descriptor]));
    }catch(e){}
  }
  faceMatcher=labeled.length?new faceapi.FaceMatcher(labeled,.48):null;
  return labeled.length;
}
function drawFaceBox(detection){
  const video=document.getElementById("faceVideo"), canvas=document.getElementById("faceCanvas");
  if(!video||!canvas)return;
  const displaySize={width:video.clientWidth,height:video.clientHeight};
  canvas.width=displaySize.width;canvas.height=displaySize.height;
  const ctx=canvas.getContext("2d");ctx.clearRect(0,0,canvas.width,canvas.height);
  const box=detection?.box;
  if(!box)return;
  const sx=displaySize.width/video.videoWidth, sy=displaySize.height/video.videoHeight;
  const x=displaySize.width-(box.x+box.width)*sx, y=box.y*sy, w=box.width*sx, h=box.height*sy;
  ctx.strokeStyle="#e9dcc4";ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);
}
async function startFaceCamera(){
  const status=document.getElementById("faceStatus");
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw Error("Camera API unavailable");
    status.textContent="Requesting camera permission…";
    faceStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"user"},width:{ideal:640},height:{ideal:480}},audio:false});
    const video=document.getElementById("faceVideo");
    video.srcObject=faceStream;
    await new Promise(resolve=>{if(video.readyState>=2) return resolve();video.onloadedmetadata=()=>resolve();setTimeout(resolve,3000)});
    await video.play().catch(()=>{});
    document.getElementById("startCamera").disabled=true;
    document.getElementById("stopCamera").disabled=false;
    document.getElementById("toggleAutoScan").disabled=false;
    status.textContent="Camera is live. Loading recognition model in the background…";
    try{
      if(typeof faceapi==="undefined") throw Error("Face recognition library did not load");
      const count=await buildFaceMatcher();
      if(count){status.textContent=`Camera ready. ${count} enrolled face${count===1?"":"s"}.`;await scanCurrentFace();}
      else{status.innerHTML="Camera is working. <b>No enrolled face photos</b> found yet. Add photos under People.";}
    }catch(modelErr){console.error("Face model error:",modelErr);status.innerHTML="Camera is working, but the face-recognition model could not load. Check your internet connection, then refresh.";}
  }catch(e){
    console.error(e);
    if(e.name==="NotAllowedError"){status.textContent="Camera permission was denied. Allow camera access for this site, then refresh.";notify("Camera permission denied");}
    else if(e.name==="NotFoundError"){status.textContent="No camera was found on this device.";notify("No camera found");}
    else{status.textContent="Camera could not start. Use localhost/HTTPS and allow camera access.";notify("Camera could not start");}
  }
}
function stopFaceCamera(){
  if(faceAutoTimer){clearInterval(faceAutoTimer);faceAutoTimer=null}
  if(faceStream)faceStream.getTracks().forEach(t=>t.stop());
  faceStream=null;faceScanning=false;
  const v=document.getElementById("faceVideo");if(v)v.srcObject=null;
  const canvas=document.getElementById("faceCanvas");if(canvas)canvas.getContext("2d")?.clearRect(0,0,canvas.width,canvas.height);
  const s=document.getElementById("faceStatus");if(s)s.textContent="Scanner is off.";
  const start=document.getElementById("startCamera");const stop=document.getElementById("stopCamera");const auto=document.getElementById("toggleAutoScan");
  if(start)start.disabled=false;if(stop)stop.disabled=true;if(auto){auto.disabled=true;auto.textContent="Auto Scan: Off"}
  faceLastMatch="";faceLastUnknownSignature="";
}
async function captureCurrentFrame(){
  const v=document.getElementById("faceVideo");
  const canvas=document.createElement("canvas");
  canvas.width=v.videoWidth||640;canvas.height=v.videoHeight||480;
  canvas.getContext("2d").drawImage(v,0,0,canvas.width,canvas.height);
  return canvas.toDataURL("image/jpeg",.88);
}
function getPersonById(id){return db.people.find(p=>p.id===id)}
function showRecognizedPerson(person,confidence){
  const result=document.getElementById("faceResult");
  if(!result)return;
  result.innerHTML=`<div class="face-result-inner match">
    <span class="match-found">${icon("check")} Match Found</span>
    <div class="face-person">${person.photo?`<img src="${person.photo}">`:`<div class="avatar">${esc((person.name||"?")[0])}</div>`}
      <div><h3>${esc(person.name)}</h3><div class="muted">Your ${esc(person.relation||"Person")}${confidence?` · ${confidence.toFixed(0)}% match`:""}</div></div>
    </div>
    <p class="muted" style="margin-top:14px">${esc(person.notes||"No notes recorded.")}</p>
    <div class="form-actions" style="justify-content:flex-start;margin-top:14px">
      <button class="rosepill" style="height:44px" data-call="${esc(person.name)}">${icon("phone")} Call ${esc(person.name)}</button>
      <button class="secondary" data-pview="${person.id}">View Profile</button>
    </div>
    <p class="muted" style="margin-top:14px;margin-bottom:0;font-size:12px">Assistive identification only. Do not use a face match as the sole basis for a high-stakes decision.</p>
  </div>`;
}
function showUnknownFace(photo){
  const n=db.people.length+1;
  const tempId=id();
  const result=document.getElementById("faceResult");
  result.innerHTML=`<div class="face-result-inner nomatch">
    <div class="face-person"><img src="${photo}" alt="Unknown face"><div><h3>New person detected</h3><div class="muted">This face does not match enrolled people with sufficient confidence.</div></div></div>
    <p class="muted">Saved as a draft profile. Add a name and details now so future scans can recognize them.</p>
    <div class="form-actions" style="justify-content:flex-start"><button class="primary" id="saveUnknown">Create New Person</button><button class="secondary" id="dismissUnknown">Dismiss</button></div>
  </div>`;
  document.getElementById("saveUnknown").onclick=()=>{
    const person={id:tempId,name:`New Person ${n}`,relation:"",category:"Other",age:"",phone:"",notes:"Added by face scanner",photo};
    db.people.unshift(person);act("person","New person created from face scan",person.name);save();
    closeFaceResultForEdit(person);
  };
  document.getElementById("dismissUnknown").onclick=()=>{result.innerHTML="";};
}
function closeFaceResultForEdit(person){
  const result=document.getElementById("faceResult");
  result.innerHTML=`<div class="face-result-inner match"><h3>New profile created</h3><p class="muted">${esc(person.name)} is now enrolled. Complete the profile information below.</p><button class="primary" id="editNewPerson">Complete Profile</button></div>`;
  document.getElementById("editNewPerson").onclick=()=>{openForm("person",person);};
}
async function scanCurrentFace(){
  if(faceScanning||!faceStream)return;
  faceScanning=true;
  const status=document.getElementById("faceStatus");
  try{
    const video=document.getElementById("faceVideo");
    const d=await faceapi.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.45})).withFaceLandmarks().withFaceDescriptor();
    drawFaceBox(d);
    if(!d){status.textContent="No face detected. Face the camera in good lighting.";faceScanning=false;return}
    if(!faceMatcher){status.textContent="No enrolled profiles with face photos.";faceScanning=false;return}
    const best=faceMatcher.findBestMatch(d.descriptor);
    const confidence=Math.max(0,Math.min(100,(1-best.distance)*100));
    const person=getPersonById(best.label);
    const now=Date.now();
    if(best.label!=="unknown" && person && best.distance<=.48){
      status.textContent=`Recognized: ${person.name}`;
      if(faceLastMatch!==person.id || now-faceLastResultAt>5000){
        showRecognizedPerson(person,confidence);
        act("person",`Face recognized: ${person.name}`,`Match ${confidence.toFixed(0)}%`);
        save();
        faceLastMatch=person.id;faceLastUnknownSignature="";faceLastResultAt=now;
      }
    }else{
      status.textContent="Face detected, but no enrolled person is a sufficiently close match.";
      const sig=Math.round(best.distance*1000);
      if(faceLastUnknownSignature!==String(sig) || now-faceLastResultAt>7000){
        const photo=await captureCurrentFrame();
        showUnknownFace(photo);
        faceLastUnknownSignature=String(sig);faceLastMatch="";faceLastResultAt=now;
      }
    }
  }catch(e){console.error(e);status.textContent="Scan failed. Try again."}finally{faceScanning=false}
}
function toggleAutoScan(){
  const btn=document.getElementById("toggleAutoScan");
  if(faceAutoTimer){clearInterval(faceAutoTimer);faceAutoTimer=null;btn.textContent="Auto Scan: Off";notify("Auto scan stopped")}
  else{faceAutoTimer=setInterval(scanCurrentFace,1800);btn.textContent="Auto Scan: On";notify("Auto scan started")}
}

render();
})();
